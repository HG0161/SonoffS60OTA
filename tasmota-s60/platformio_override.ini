[platformio]
default_envs = tasmota32c3-s60-trial

[env:tasmota32c3-s60-trial]
extends                 = env:tasmota32_base
board                   = esp32c3
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_LITE
                          -DS60_CUSTOM_BUILD
                          -DS60_OTA_TRIAL
                          -DOTA_URL='""'
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP

[env:tasmota32c3-s60-final]
extends                 = env:tasmota32_base
board                   = esp32c3
board_build.partitions  = partitions/esp32_partition_app2880k_fs320k.csv
build_flags             = ${env:tasmota32_base.build_flags}
                          -DFIRMWARE_LITE
                          -DS60_CUSTOM_BUILD
                          -DOTA_URL='""'
lib_ignore              = ${env:tasmota32_base.lib_ignore}
                          Micro-RTSP
